# Deploy — zweigleisig: pm2-Server (ecommlab-cloud) ODER Google Cloud Run.
#
# Ziel-Wahl:
#   · Push auf main         → DEFAULT_TARGET (unten), aktuell "ecommlab-cloud"
#   · Actions-Tab → Run     → Ziel manuell wählbar (ecommlab-cloud | gcloud)
#
# Ziel "ecommlab-cloud": 91.98.93.10 (CloudPanel), Site unter User "ecomde"
# (/home/ecomde/htdocs/ecommlab.de, Releases + Symlink current). nginx proxied ecommlab.de und ecommlab.io
# auf 127.0.0.1:3000. Deploy läuft ALS dieser User.
#
# Benötigte Repository-Secrets (identisch zu mydev.ai):
#   ECOMMLAB_SSH_KEY      privater Deploy-Schlüssel (ed25519, ohne Passphrase)
#   ECOMMLAB_KNOWN_HOSTS  Host-Key des Servers (verhindert MITM):
#                         91.98.93.10 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH3zZl4eHDwbpn0i3zE20hKUbaSy37ddMOeDFGC3d9hh

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy-Ziel"
        type: choice
        options: [ecommlab-cloud, gcloud]
        default: ecommlab-cloud
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"

permissions:
  contents: read
  id-token: write # OIDC für Workload Identity Federation (nur gcloud-Ziel)

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DEFAULT_TARGET: ecommlab-cloud

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
      ready: ${{ steps.pick.outputs.ready }}
    steps:
      - id: pick
        run: |
          TARGET="${{ inputs.target || env.DEFAULT_TARGET }}"
          READY=true
          if [ "$TARGET" = "ecommlab-cloud" ] && [ -z "${{ secrets.ECOMMLAB_SSH_KEY }}" ]; then
            READY=false
            echo "::warning::Secret ECOMMLAB_SSH_KEY fehlt — Deploy wird übersprungen (Einrichtung: deploy/README.md)"
          fi
          {
            echo "name=${TARGET}"
            echo "ready=${READY}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 🎯 Deploy-Ziel: \`${TARGET}\`"
            [ "$READY" = "false" ] && echo "> ⏭️ **Übersprungen** — Secret \`ECOMMLAB_SSH_KEY\` fehlt. Einrichtung: [deploy/README.md](../blob/main/deploy/README.md)"
          } >> "$GITHUB_STEP_SUMMARY" || true

  deploy-ecommlab:
    needs: [target]
    if: needs.target.outputs.name == 'ecommlab-cloud' && needs.target.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH einrichten
        env:
          SSH_KEY: ${{ secrets.ECOMMLAB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ECOMMLAB_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret ECOMMLAB_SSH_KEY fehlt — siehe deploy/README.md"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          python3 - <<'PY'
          import os, pathlib
          key = os.environ["SSH_KEY"].replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          pathlib.Path.home().joinpath(".ssh/id_ed25519").write_text(key)
          hosts = os.environ["KNOWN_HOSTS"].replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          pathlib.Path.home().joinpath(".ssh/known_hosts").write_text(hosts)
          pathlib.Path.home().joinpath(".ssh/config").write_text(
              "Host 91.98.93.10\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n"
          )
          PY
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/config
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/tmp/deploy.pub
          echo "Deploy-Pubkey (Fingerprint):"
          ssh-keygen -lf ~/.ssh/id_ed25519

      - name: Deploy auf ecommlab-cloud
        env:
          SKIP_VERIFY: "1"
        run: |
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh ecomde@91.98.93.10

      - name: Zusammenfassung
        run: |
          {
            echo "### ✅ Deploy auf ecommlab-cloud"
            echo "- App: \`ecommlab-prod\` (pm2 User ecomde), Port 3000"
            echo "- Path: \`/home/ecomde/htdocs/ecommlab.de/current\` (Release: \`${GITHUB_SHA::12}\`)"
            echo "- Rollback: \`./scripts/deploy.sh rollback\`"
            echo "- Host: \`91.98.93.10\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-gcloud:
    needs: [target]
    if: needs.target.outputs.name == 'gcloud'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Umgebung auflösen
        id: env
        run: |
          ENV=prod
          set -a; source "deploy/environments/${ENV}.env"; set +a
          if [ "${PROJECT_NUMBER}" = "CHANGEME_RUN_PROVISION" ] || [ -z "${PROJECT_NUMBER}" ]; then
            echo "::error::${ENV}.env hat keine PROJECT_NUMBER — scripts/gcp-provision.sh ${ENV} --write-config"
            exit 1
          fi
          {
            echo "env_name=${ENV}"
            echo "project_id=${PROJECT_ID}"
            echo "region=${REGION}"
            echo "repo=${REPO}"
            echo "web_service=${WEB_SERVICE}"
            echo "site_url=${NEXT_PUBLIC_SITE_URL}"
            echo "consentok_id=${NEXT_PUBLIC_CONSENTOK_ID}"
            echo "ga4_id=${NEXT_PUBLIC_GA4_MEASUREMENT_ID}"
            echo "turnstile_site_key=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}"
            echo "wif_provider=projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL}/providers/${WIF_PROVIDER}"
            echo "deployer_sa=${DEPLOYER_SA}@${PROJECT_ID}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.env.outputs.wif_provider }}
          service_account: ${{ steps.env.outputs.deployer_sa }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.env.outputs.project_id }}

      - name: Build & Deploy über Cloud Build
        run: |
          gcloud builds submit \
            --project "${{ steps.env.outputs.project_id }}" \
            --config cloudbuild.yaml \
            --substitutions=COMMIT_SHA=${GITHUB_SHA::12},_REGION=${{ steps.env.outputs.region }},_REPO=${{ steps.env.outputs.repo }},_SERVICE=${{ steps.env.outputs.web_service }},_NEXT_PUBLIC_SITE_URL=${{ steps.env.outputs.site_url }},_NEXT_PUBLIC_CONSENTOK_ID=${{ steps.env.outputs.consentok_id }},_NEXT_PUBLIC_GA4_MEASUREMENT_ID=${{ steps.env.outputs.ga4_id }},_NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ steps.env.outputs.turnstile_site_key }} \
            .

      - name: Zusammenfassung
        run: |
          URL=$(gcloud run services describe "${{ steps.env.outputs.web_service }}" \
            --project "${{ steps.env.outputs.project_id }}" \
            --region "${{ steps.env.outputs.region }}" --format 'value(status.url)')
          {
            echo "### ✅ Deploy auf Google Cloud Run"
            echo "- Service: \`${{ steps.env.outputs.web_service }}\`"
            echo "- URL: ${URL}"
            echo "- Hinweis: DNS zeigt auf ecommlab-cloud, bis ihr bewusst auf GCP umstellt."
          } >> "$GITHUB_STEP_SUMMARY"
